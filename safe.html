<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FNS 세이프 | HACCP 품질 관제 모의 점검 시나리오</title>

<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  --glass: rgba(17, 20, 27, .74);
  --glass-hi: rgba(255, 255, 255, .07);
  --glass-hi2: rgba(255, 255, 255, .13);
  --line: rgba(255, 255, 255, .10);
  --text: #f4f5f7;
  --muted: #9aa3ae;
  --accent: #f59e0b;
  --accent-soft: rgba(245, 158, 11, .28);
  --ok: #37d399;
  --warn: #f6b94a;
  --info: #62a8ff;
  --radius: 14px;
  font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #20232b; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid #ffffffcc; outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
}

/* top bar */
.topbar { position: fixed; z-index: 30; top: 10px; left: 10px; right: 10px; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 6px; white-space: nowrap; }
.logo { width: 34px; height: 34px; border-radius: 50%; background: #d2232a; display: grid; place-items: center; font: italic 700 12.5px/1 Georgia, serif; color: #fff; box-shadow: inset 0 0 0 2px #d2232a, inset 0 0 0 3.5px #fff; }
.brand b { display: block; font-size: 15px; letter-spacing: -.2px; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.search { position: relative; flex: 0 1 300px; min-width: 150px; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); padding: 0 12px 0 34px; font-size: 13.5px; outline: none; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; opacity: .6; }
.chip { height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); font-size: 13.5px; white-space: nowrap; }
.chip:hover { background: var(--glass-hi2); }
.chip.accent { background: var(--accent); border-color: transparent; font-weight: 600; color: #1c1405; }
.chip.accent:hover { background: #fbbf24; }
.chip small { color: var(--muted); font-size: 12px; }
.chip .caret { opacity: .7; font-size: 10px; }
.spacer { flex: 1; }
.dd { position: relative; }
.menu { position: absolute; top: 46px; right: 0; min-width: 210px; padding: 6px; z-index: 40; }
.menu.left { left: 0; right: auto; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; font-size: 13.5px; }
.menu button:hover, .menu button[aria-selected='true'] { background: var(--glass-hi2); }
.menu small { color: var(--muted); margin-left: auto; font-size: 12px; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; white-space: nowrap; }
.clock b { font-size: 16px; }
.clock small { color: var(--muted); font-size: 11.5px; }
.sim { font-size: 11px; font-weight: 700; color: #1c1405; background: var(--accent); padding: 3px 7px; border-radius: 6px; letter-spacing: .2px; white-space: nowrap; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #e8333c; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.alerts-menu { width: 300px; max-height: 340px; overflow: auto; }
.alert-row { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
.alert-row + .alert-row { border-top: 1px solid var(--line); border-radius: 0; }
.alert-row time { color: var(--muted); font-size: 12px; flex: 0 0 38px; }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--glass-hi); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 0 13px; height: 30px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed='true'] { background: #fff; color: #15171c; font-weight: 600; }
.user { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #4b5563, #1f2937); display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--line); }

/* KPI cards */
.kpis { position: fixed; z-index: 20; top: 78px; left: 10px; display: flex; gap: 10px; }
.kpi { width: 232px; padding: 13px 14px 12px; display: grid; grid-template-columns: 34px 1fr auto; column-gap: 11px; align-items: center; }
.kpi .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: #fcd34d; }
.kpi .ic svg { width: 18px; height: 18px; }
.kpi h3 { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.kpi .val { font-size: 23px; font-weight: 700; letter-spacing: -.4px; margin-top: 2px; }
.kpi .val small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .sub { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kpi .spark { width: 64px; height: 30px; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 30px; }
.bars i { width: 9px; border-radius: 2px; background: var(--accent); opacity: .9; }

/* detail panel */
.detail { position: fixed; z-index: 20; top: 78px; right: 10px; width: 340px; max-height: calc(100% - 300px); display: flex; flex-direction: column; overflow: hidden; }
.detail-head { padding: 14px 14px 10px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); }
.detail-head .kind { font-size: 12px; color: var(--muted); }
.detail-head h2 { margin: 2px 0 0; font-size: 19px; letter-spacing: -.3px; line-height: 1.3; }
.detail-head .x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--glass-hi); font-size: 18px; line-height: 1; flex: 0 0 30px; }
.detail-body { padding: 10px 14px 14px; overflow-y: auto; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: rgba(55, 211, 153, .12); }
.pill.warn { color: var(--warn); background: rgba(246, 185, 74, .13); }
.pill.info { color: var(--info); background: rgba(98, 168, 255, .13); }
.pill.red { color: #ff7b80; background: rgba(232, 51, 60, .2); }
.pill.mute { color: var(--muted); background: var(--glass-hi); }
.stats { display: grid; gap: 0; margin: 4px 0 6px; }
.stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.stat span:first-child { color: var(--muted); }
.stat b { font-weight: 600; text-align: right; }
.prog { height: 6px; border-radius: 3px; background: var(--glass-hi2); overflow: hidden; margin: 6px 0 2px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.desc { font-size: 13.5px; line-height: 1.65; color: #d9dde2; margin: 10px 0 4px; word-break: keep-all; }
.note { font-size: 11.5px; line-height: 1.55; color: var(--muted); margin: 10px 0 0; word-break: keep-all; }
.cams-title { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 14px 0 8px; }
.cams-title small { color: var(--muted); font-weight: 400; }
.cams { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cam { position: relative; padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 10; background: #000; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
.cam span { position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px #000; }
.cam:hover img { opacity: 1; }

/* batch tracker */
.tracker { position: fixed; z-index: 20; left: 10px; bottom: 10px; width: 440px; padding: 13px 16px 14px; }
.tr-head { display: flex; align-items: center; gap: 8px; }
.tr-head h3 { margin: 0; font-size: 14px; }
.tr-id { font-size: 12px; font-weight: 700; background: var(--accent); padding: 3px 8px; border-radius: 6px; color: #1c1405; }
.tr-meta { font-size: 12px; color: var(--muted); }
.tr-eta { margin-left: auto; text-align: right; }
.tr-eta b { display: block; font-size: 17px; color: var(--ok); }
.tr-eta small { font-size: 11px; color: var(--muted); }
.tr-line { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 14px; }
.tr-line::before { content: ''; position: absolute; left: 8%; right: 8%; top: 9px; height: 2px; background: var(--glass-hi2); }
.tr-fill { position: absolute; left: 8%; top: 9px; height: 2px; background: var(--accent); width: 0; transition: width .4s; }
.tr-step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
.tr-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--glass-hi2); background: #22262f; display: grid; place-items: center; font-size: 11px; }
.tr-step.done .tr-dot { background: var(--accent); border-color: var(--accent); }
.tr-step.now .tr-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tr-step time { font-size: 12px; font-weight: 600; }
.tr-step span { font-size: 11px; color: var(--muted); line-height: 1.25; word-break: keep-all; }

/* table */
.table { position: fixed; z-index: 20; left: 460px; right: 360px; bottom: 10px; height: 214px; padding: 10px 12px; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; align-items: center; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-size: 13px; }
.tabs button[aria-selected='true'] { background: var(--accent); color: #1c1405; font-weight: 600; }
.tabs .live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(55, 211, 153, .2); }
.tbl-wrap { overflow: auto; margin-top: 6px; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; position: sticky; top: 0; background: rgba(22, 25, 32, .96); }
td { padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--glass-hi); }
tbody tr.sel td { background: var(--accent-soft); }
.mini { display: inline-block; width: 70px; height: 5px; border-radius: 3px; background: var(--glass-hi2); vertical-align: middle; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); }

/* world labels, selection label */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.wlabel { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; padding: 5px 10px; border-radius: 8px; background: rgba(17, 20, 27, .82); font-size: 12.5px; font-weight: 600; white-space: nowrap; transform-origin: 50% 100%; }
.wlabel::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 12px; margin-left: -1px; background: rgba(17, 20, 27, .82); }
.wlabel.sel { background: var(--accent); pointer-events: none; color: #1c1405; }
.wlabel.sel::after { background: var(--accent); }
.wlabel small { display: block; font-size: 11px; font-weight: 500; opacity: .85; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .78); display: grid; place-items: center; padding: 30px; }
.lightbox figure { margin: 0; max-width: min(1100px, 100%); }
.lightbox img { width: 100%; border-radius: 12px; display: block; }
.lightbox figcaption { margin-top: 10px; font-size: 13px; color: #d9dde2; }
.loading { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: #20232b; font-size: 14px; color: var(--muted); }
.mtabs { display: none; }

@media (max-width: 1320px) { .table { display: none; } }
@media (max-width: 1080px) { .kpi:nth-child(3) { display: none; } }
@media (max-width: 820px) {
  .topbar { top: 8px; left: 8px; right: 8px; height: auto; flex-wrap: wrap; padding: 8px; gap: 8px; }
  .brand small, .clock small, .user, .search, .brand div, .chip .caret, #weather-name { display: none; }
  .chip { padding: 0 9px; }
  .sim { font-size: 10.5px; padding: 3px 5px; }
  .seg button { padding: 0 9px; }
  .brand { padding-right: 0; }
  #area { order: 5; flex: 1 1 100%; }
  #area .chip { width: 100%; justify-content: space-between; }
  .chip#weather-btn small { display: none; }
  .kpis { top: var(--top, 112px); left: 8px; right: 8px; overflow-x: auto; scrollbar-width: none; }
  .kpi { flex: 0 0 200px; padding: 10px 12px; }
  .kpi:nth-child(3) { display: grid; }
  .kpi .val { font-size: 19px; }
  .kpi .spark, .kpi .bars { display: none; }
  .detail, .tracker, .table { left: 8px; right: 8px; width: auto; bottom: 62px; top: auto; max-height: 46vh; height: auto; display: none; }
  body[data-mtab='detail'] .detail { display: flex; }
  body[data-mtab='tracker'] .tracker { display: block; }
  body[data-mtab='table'] .table { display: flex; height: 46vh; }
  .mtabs { position: fixed; z-index: 25; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 4px; padding: 5px; }
  .mtabs button { flex: 1; border: 0; background: transparent; color: var(--muted); height: 38px; border-radius: 9px; font-size: 13px; }
  .mtabs button[aria-pressed='true'] { background: var(--accent); color: #fff; font-weight: 600; }
  .tr-step span { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { .tr-fill { transition: none; } }

/* FNS safe additions */
.logo { background: #f59e0b; color: #1c1405; box-shadow: inset 0 0 0 2px #f59e0b, inset 0 0 0 3.5px #fff; font: 800 11px/1 Pretendard, sans-serif; letter-spacing: -.3px; }
.mtabs button[aria-pressed='true'], .tr-step.done .tr-dot { color: #1c1405; }
.tr-head h3 em, .tr-meta em, .wlabel em, td em, .stat em { font-style: normal; font-size: 10.5px; font-weight: 700; color: #fcd34d; background: rgba(245, 158, 11, .16); padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
.wlabel.pin { display: flex; flex-direction: column; align-items: flex-start; padding: 5px 9px 5px 9px; }
.wlabel.pin .pt { display: flex; align-items: center; gap: 6px; }
.wlabel.pin .pt::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #37d399); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, #37d399) 30%, transparent); }
.wlabel.pin.al::after { left: calc(100% - 16px); }
.wlabel.pin.ar::after { left: 16px; }
.wlabel.pin.blink .pt::before { animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.certs-title { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 14px 0 8px; }
.certs-title small { color: var(--muted); font-weight: 400; font-size: 11.5px; }
.certs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cert { border: 1px solid rgba(245, 158, 11, .35); background: rgba(245, 158, 11, .08); border-radius: 9px; padding: 7px 9px; }
.cert b { display: block; font-size: 13px; }
.cert span { font-size: 11.5px; color: var(--muted); }
.logs { margin: 4px 0 0; }
.logrow { display: grid; grid-template-columns: 42px 1fr auto; gap: 8px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
.logrow time { color: var(--muted); }
.logrow small { color: var(--muted); font-size: 11.5px; }
.sub-title { font-size: 12.5px; font-weight: 600; margin: 14px 0 2px; display: flex; justify-content: space-between; }
.sub-title small { color: var(--muted); font-weight: 400; }
.menu a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: inherit; text-decoration: none; }
.menu a:hover { background: var(--glass-hi2); }
#area-menu { max-height: calc(100vh - 140px); overflow: auto; }
.menu a small { color: var(--muted); margin-left: auto; font-size: 12px; }
.bars i { width: 9px; }
.tr-head h3 { white-space: nowrap; }
.ch { display: inline-flex; align-items: center; gap: 6px; }
.ch::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend { position: fixed; z-index: 20; top: 182px; left: 10px; display: flex; gap: 12px; padding: 7px 12px; font-size: 12px; color: var(--muted); }
.menu button:disabled { opacity: .45; cursor: default; }
@media (max-width: 820px) { .legend { display: none; } }
</style>
</head>
<body data-mtab="none">
<canvas id="scene" aria-label="오산 HQ 7개 층 단면 위에 CCP 예시 지점과 모의 이탈 대응, 1층 Hold 구역을 보여주는 HACCP 품질 관제 모의 점검 시나리오 3D 화면"></canvas>
<div id="labels"></div>

<header class="topbar glass">
  <div class="brand"><span class="logo" aria-hidden="true">CCP</span><div><b>FNS 세이프</b><small>HACCP 품질 관제 · 모의 점검 시나리오</small></div></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="CCP, 로트, 담당자 검색" autocomplete="off" aria-label="CCP, 로트, 담당자 검색" />
    <div class="menu left glass" id="search-menu" hidden></div>
  </div>
  <div class="dd" id="area">
    <button class="chip accent" id="area-btn" aria-haspopup="true" aria-expanded="false"><span id="area-name">전체 보기</span><span class="caret">▼</span></button>
    <div class="menu left glass" id="area-menu" hidden></div>
  </div>
  <div class="spacer"></div>
  <div class="dd">
    <button class="chip" id="weather-btn" aria-haspopup="true" aria-expanded="false" aria-label="운영 모드"><span id="weather-ic"></span><b id="weather-temp">정상 가동</b><small id="weather-name">모의 점검</small><span class="caret">▼</span></button>
    <div class="menu glass" id="weather-menu" hidden></div>
  </div>
  <div class="clock"><b class="num" id="clock">15:00</b><small id="date"></small></div>
  <span class="sim">시뮬레이션</span>
  <div class="dd">
    <button class="icon-btn" id="alert-btn" aria-label="알림" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>

  d.s = Math.min(d.route.len, d.s + d.v * dt);

// ---------- 1F forklift (index.html leg system) ----------

  const day = clamp((se + .08) / .3, 0, 1), gold = 1 - clamp((se - .1) / .6, 0, 1);
  const bg = _c3.copy(sim.mode === 'heat' ? BG.heat : BG.day).lerp(BG.night, 1 - day);
  scene.background.copy(bg); scene.fog.color.copy(bg);
  scene.environmentIntensity = lerp(.1, .34, day);
  const az = Math.PI * clamp(a, 0, 1), elev = Math.max(.12, se) * .85;
  sun.userData.dir = day > 0 ? V(Math.cos(az), Math.sin(elev) + .15, Math.sin(az) * .7 + .35).normalize() : V(-.4, .9, .3).normalize();
  sun.color.copy(_c1.set(0xfff4e6).lerp(C3(0xffb27a), gold * .7)).lerp(C3(0x9fb4e0), 1 - day);
  sun.intensity = lerp(.35, lerp(3.0, 2.4, gold), day) * (sim.mode === 'heat' ? 1.12 : 1);
  hemi.color.copy(_c1.set(0xdfe7f5).lerp(C3(0xffd9b8), gold * .6)).lerp(C3(0x34507e), 1 - day);
  hemi.groundColor.set(0x8f8577).lerp(C3(0x1c2028), 1 - day);
  hemi.intensity = lerp(.4, .62, day);
  const night = 1 - day;
  WIN.emissiveIntensity = night * 1.1; BLUEGLASS.emissiveIntensity = night * .8; LIGHTP.emissiveIntensity = .55 + night * 1.6;
  LAMP.emissiveIntensity = .15 + night * 3; HEAD.emissiveIntensity = .2 + night * 3; TAIL.emissiveIntensity = .2 + night * 2.2;
  renderer.toneMappingExposure = lerp(.95, 1.0, day);
}

// ---------- layout-aware framing ----------
function hudInsets() {
  if (mqMobile.matches) { const top = $('.topbar').getBoundingClientRect().bottom + 80; const bot = document.body.dataset.mtab === 'none' ? 60 : innerHeight * .46 + 60; return { l: 0, r: 0, t: top, b: bot }; }
  const r = $('#detail').getBoundingClientRect();
  return { l: 0, r: innerWidth - r.left, t: 150, b: 230 };
}
function resize() {
  document.documentElement.style.setProperty('--top', `${Math.round($('.topbar').getBoundingClientRect().bottom + 8)}px`);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  const i = hudInsets();
  camera.setViewOffset(innerWidth, innerHeight, (i.r - i.l) / 2, (i.b - i.t) / 2, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  composer?.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

// ---------- loop ----------
let hudT = 0;
const limits = new THREE.Box3(V(-300, 0, -220), V(300, 60, 260));
const _w = V();
function step(dt, draw = true) {
  stepSim(dt); stepWarp(dt); stepTime(); stepFacade(dt);
  SHUTTERS.forEach((m, i) => { const o = i ? DOCKS[i - 1].doorO : 0; m.scale.y = 1 - .9 * o; m.position.y = fy(1) + 3.0 - 1.5 * m.scale.y; });
  // a followed person or lot keeps its floor open
  if (selected && ['worker', 'lot'].includes(selected.kind)) { const n = cutFor(selected); if (n && n !== cutFloor) { setCut(n); syncArea(); } }
  stepGlide(dt);
  if (!glide && followGet) {
    const p = followPos();
    if (p && followPrev && p.distanceTo(followPrev) > 5) { const s = sph(); flyTo(p, s.r, s.theta, s.phi, 1.1); followPrev = p; }
    else if (p && followPrev) { const d = p.clone().sub(followPrev); controls.target.add(d); camera.position.add(d); followPrev = p; }
    else if (p) followPrev = p;
    else if (!['worker', 'lot'].includes(selected?.kind)) followGet = null;
  }
  if (!glide) {
    controls.update();
    const c = V().copy(controls.target).clamp(limits.min, limits.max).sub(controls.target);
    if (c.lengthSq()) { controls.target.add(c); camera.position.add(c); }
  }
  const t = controls.target, dist = camera.position.distanceTo(t), half = clamp(dist * .42, 40, 300);
  sun.target.position.copy(t); sun.position.copy(t).addScaledVector(sun.userData.dir || V(0, 1, 0), 420);
  const sc = sun.shadow.camera;
  if (Math.abs(sc.right - half) > 2) { sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 20; sc.far = 1000; sc.updateProjectionMatrix(); }
  const ra = ringAnchor(selected);
  ring.visible = !!ra;
  if (ra) { ring.position.copy(ra[0]); ring.scale.setScalar(ra[1] * (1 + Math.sin(sim.t * 5) * .07)); }
  // CCP pins: colour by status, blink on a mock deviation, constant on-screen size
  for (const c of CCPS) {
    c.pinG.visible = cutFloor == null || c.n === cutFloor;           // pins draw on top, so only the open floor's pins show
    const col = c.status === 'dev' && Math.sin(sim.t * 9) < 0 ? 0x5a1a1f : STATUS_COL[c.status];
    c.pinMat.color.setHex(col); c.halo.material.color.setHex(c.status === 'ok' ? 0xf59e0b : STATUS_COL[c.status]);
    c.lamp.material.emissive.setHex(c.type === 'metal' && testFlash() ? 0xf59e0b : col);
    c.pinG.getWorldPosition(_w);
    const s = clamp(camera.position.distanceTo(_w) / 42, 1, 3.4);
    c.pinG.scale.setScalar(s); c.pinG.position.y = c.pin[1] + Math.sin(sim.t * 2 + c.p1) * .06 * s;
    c.halo.lookAt(camera.position);
  }
  for (const L of PIN_LABELS) {
    const c = L.c, vis = shown(c.pinG);
    L.b.hidden = !vis || (selected?.kind === 'ccp' && selected.c === c);
    if (L.b.hidden) continue;
    const html = `<span class="pt">${c.no}<em>CCP 예시</em></span><small>${c.short} · ${shortReading(c)}</small>`;
    if (html !== L.html) { L.html = html; L.b.innerHTML = html; }
    L.b.style.setProperty('--c', STATUS_CSS[c.status]); L.b.classList.toggle('blink', c.status === 'dev');
    c.pinG.getWorldPosition(_w); project(_w.add(V(0, .5 * c.pinG.scale.x, 0)), L.b, 0, c.align);
  }
  if (selected && !['all'].includes(selected.kind) && (ra || selected.kind === 'ccp')) {
    const d = selected; selLabel.hidden = false;
    let a = ra ? ra[0].clone().add(V(0, d.kind === 'worker' ? 2.2 : d.kind === 'lot' ? 1.8 : d.kind === 'lift' ? 3 : d.place === 'cert' ? 6.9 : 3.6, 0)) : null;
    if (d.kind === 'ccp') { d.c.pinG.getWorldPosition(_w); a = _w.clone().add(V(0, .5 * d.c.pinG.scale.x, 0)); }
    selLabel.innerHTML = d.kind === 'ccp' ? `${d.c.no}<em>CCP 예시</em><small>${d.c.short} · ${shortReading(d.c)}</small>` : d.kind === 'worker' ? `${d.name}<small>${d.role === 'prod' ? workerAct(FLOOR_CTRL[d.n]) : d.role === 'qa' ? d.w.text : QA[1].text}</small>` : d.kind === 'lot' ? `${d.lot.id}<small>${d.lot.stage}</small>` : d.kind === 'lift' ? `지게차<small>${liftStatus()}</small>` : d.kind === 'dev' ? `${d.d.ccp.no}<small>${DEV_STEPS[PHASE_STEP[d.d.phase]]}</small>` : `${d.name}`;
    project(a, selLabel);
  } else selLabel.hidden = true;
  hudT -= dt;
  if (hudT <= 0) { hudT = .4; updateKpis(); updateTracker(); updateTable(); updateAlerts(); updateClock(); renderDetail(); }
  if (!draw) return;
  if (composer) composer.render(); else renderer.render(scene, camera);
}
const timer = new THREE.Clock();
function frame() { requestAnimationFrame(frame); const dt = Math.min(.05, timer.getDelta()); if (document.hidden) return; step(dt); }

// ---------- selftest (?debug&selftest): geometry overlap, stuck, completed mock-deviation cycles ----------
function obbOverlap(a, b) {
  const axes = [a.f, a.r, b.f, b.r];
  for (const [ax, az] of axes) {
    const proj = o => { const c = o.cx * ax + o.cz * az, e = Math.abs(o.f[0] * ax + o.f[1] * az) * o.hl + Math.abs(o.r[0] * ax + o.r[1] * az) * o.hw; return [c - e, c + e]; };
    const [a0, a1] = proj(a), [b0, b1] = proj(b);
    if (a1 < b0 || b1 < a0) return false;
  }
  return true;
}
function liftBox() {
  const o = LIFT.obj, h = o.rotation.y, f = [Math.sin(h), Math.cos(h)], r = [Math.cos(h), -Math.sin(h)];
  const zMin = -1.4, zMax = 2.25, mid = (zMin + zMax) / 2;
  return { cx: o.position.x + f[0] * mid, cz: o.position.z + f[1] * mid, f, r, hl: (zMax - zMin) / 2, hw: .66 };
}
const gapTo = (lb, x, z) => { const dx = x - lb.cx, dz = z - lb.cz, lf = Math.abs(dx * lb.f[0] + dz * lb.f[1]) - lb.hl, lr = Math.abs(dx * lb.r[0] + dz * lb.r[1]) - lb.hw; return (lf < 0 && lr < 0 ? Math.max(lf, lr) : Math.hypot(Math.max(0, lf), Math.max(0, lr))) - .25; };
function truckBox(d) { const h = d.tr.rotation.y, f = [Math.sin(h), Math.cos(h)], r = [Math.cos(h), -Math.sin(h)]; return { cx: d.tr.position.x - f[0] * .1, cz: d.tr.position.z - f[1] * .1, f, r, hl: 5.0, hw: 1.3 }; }
function selftest() {
  const res = { errors: 0, overlaps: 0, overlapBy: { liftPerson: 0, liftTruck: 0, truckTruck: 0 }, stuck: 0, stuckList: [], cycles: 0, byType: {}, maxOpen: 0, steps: 0, modeSteps: {}, shipped: 0, held: 0, liftJobs: 0, zoneWaitsMax: 0, auditRoutes: 0, minPersonLiftGap: Infinity, devInterval: { normalSimH: '2–4.5 (폭염 ×0.45, 첫 이탈도 같은 간격)', selftestRealSec: '10–18' }, mobileCss: 'run.html과 동일(max-width 820px 블록 원문 유지)' };
  const c0 = sim.cycles, s0 = sim.shipped; sim.byType = { cook: 0, metal: 0, cold: 0 };
  const a0 = sim.audits || 0; let liftStill = 0; const liftWas = V().copy(LIFT.obj.position);
  const flagged = new Set(), stuckOnce = (k, msg) => { if (!flagged.has(k)) { flagged.add(k); res.stuck++; res.stuckList.push(msg); } };
  { // detector self-check: a body on the forks must count, one 3 m beside the forklift must not; a truck moved onto another must overlap
    const lb = liftBox(), f = lb.f;
    const truckA = truckBox(DOCKS[0]), truckB = { ...truckBox(DOCKS[0]), cx: truckA.cx + 1.5 };
    res.detectorCheck = gapTo(lb, LIFT.obj.position.x + f[0] * 1.8, LIFT.obj.position.z + f[1] * 1.8) < .1 && gapTo(lb, lb.cx + lb.r[0] * 3, lb.cz + lb.r[1] * 3) > .1 && obbOverlap(truckA, truckB) && !obbOverlap(truckA, truckBox(DOCKS[1])) ? 'ok' : 'FAILED';
  }
  const plan = [['normal', 2600], ['audit', 2800], ['heat', 1600], ['wash', 1400], ['normal', 1800]];
  scheduleNext();
  for (const [m, n] of plan) {
    setMode(m, { quiet: true });
    res.modeSteps[m] = (res.modeSteps[m] || 0) + n;
    for (let i = 0; i < n; i++) {
      stepSim(.1); res.steps++;
      // forklift vs people on 1F (real geometry, independent of the zone lock)
      const lb = liftBox();
      for (const w of WALKERS) if (w.floor === 1) for (const [x, z] of bodies(w)) {
        const gap = gapTo(lb, x, z);
        res.minPersonLiftGap = Math.min(res.minPersonLiftGap, gap);
        if (gap < .1) { res.overlaps++; res.overlapBy.liftPerson++; }
      }
      for (const d of DOCKS) if (obbOverlap(lb, truckBox(d))) { res.overlaps++; res.overlapBy.liftTruck++; }
      for (let a = 0; a < DOCKS.length; a++) for (let b = a + 1; b < DOCKS.length; b++) if (obbOverlap(truckBox(DOCKS[a]), truckBox(DOCKS[b]))) { res.overlaps++; res.overlapBy.truckTruck++; }
      res.maxOpen = Math.max(res.maxOpen, sim.devs.filter(x => x.open).length);
      // stuck: forklift with a leg but no movement, walkers, elevator, deviations, floors
      if (LIFT.leg) { if (LIFT.obj.position.distanceTo(liftWas) < .02 && Math.abs(LIFT.carriage.position.y - (LIFT.leg.def.liftTo ?? 0)) < .02) liftStill += .1; else liftStill = 0; } else liftStill = 0;
      liftWas.copy(LIFT.obj.position);
      if (liftStill > 90) stuckOnce('lift' + Math.floor(sim.t / 100), `forklift still ${sim.t.toFixed(0)}`);
      for (const w of WALKERS) {
        if (w.act?.t === 'go' && sim.t - w.lastMove > 90) stuckOnce(w.id + 'go' + Math.floor(w.lastMove), `${w.name} not moving ${sim.t.toFixed(0)}`);
        if (w.waitT > 90) stuckOnce(w.id + 'wait' + Math.floor(sim.t / 200), `${w.name} waiting ${w.text}`);
        res.zoneWaitsMax = Math.max(res.zoneWaitsMax, w.waitT);
      }
      if (ELEV.state !== 'idle' && sim.t - ELEV.stateT > 90) stuckOnce('elev' + ELEV.stateT, `elevator ${ELEV.state}`);
      for (const D of sim.devs) if (D.open && sim.t - D.t0 > 360) stuckOnce('dev' + D.id, `${D.id} open in ${D.phase}`);
      for (const c of Object.values(FLOOR_CTRL)) if (c.state === 'blocked' && sim.t - c.stateT > 150) stuckOnce('floor' + c.n + c.stateT, `${c.n}F blocked`);
      if (LIFT.leg && !res._lj) { res._lj = true; res.liftJobs++; } else if (!LIFT.leg) res._lj = false;
    }
  }
  delete res._lj;
  setMode('normal', { quiet: true });
  res.cycles = sim.cycles - c0; res.byType = { ...sim.byType }; res.shipped = sim.shipped - s0;
  res.held = sim.lots.filter(l => l.dev).length; res.auditRoutes = (sim.audits || 0) - a0;
  res.minPersonLiftGap = +res.minPersonLiftGap.toFixed(2);
  res.errors = window.__err.length; if (res.errors) res.errorList = window.__err.slice(0, 6);
  res.pass = res.detectorCheck === 'ok' && res.errors === 0 && res.overlaps === 0 && res.stuck === 0 && res.cycles >= 3 && res.maxOpen <= 1 && ['cook', 'metal', 'cold'].every(t => res.byType[t] >= 1);
  const el = $('#selftest'); el.textContent = JSON.stringify(res);
  return res;
}

// warm up: run the plant before the first frame so lines, lift and docks are already busy
const warm0 = performance.now();
for (let i = 0; i < 4200; i++) stepSim(.1);
if (DEBUG) console.info('warm-up ms', Math.round(performance.now() - warm0));
$('#date').textContent = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
setMode('normal', { quiet: true }); sim.unread = 3;
if (SELFTEST) { try { selftest(); } catch (err) { $('#selftest').textContent = JSON.stringify({ errors: window.__err.length + 1, error: String(err && err.stack || err) }); } }
scheduleNext();
resize();
setView(...VIEWS.street());
renderDetail(); updateKpis(); updateTracker(); updateTable(); updateClock();
if (DEBUG) window.__sim = { setView, VIEWS, setFacade, setMode, step: (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) step(dt); }, stepSim, select, defById, sim, CCPS, FLOOR_CTRL, LIFT, ELEV, HOLD, DROP, STAGE, COLD, DOCKS, ZONE, WALKERS, QA, startDev, openDev, camera, controls, renderer, scene, warpTo, floors, V, get selected() { return selected; } };
$('#loading').hidden = true;
frame();
// ?debug&focus=<id>&cut&m=<mode>&ev=<cook|metal|cold>&adv=<steps>&t=<hour> opens a view directly (checks and screenshots)
const FOCUS = DEBUG && QS.get('focus');
if (DEBUG && QS.get('m')) setMode(QS.get('m'), { quiet: true });
if (DEBUG && QS.get('ev')) { const ty = QS.get('ev'); for (let i = 0; i < 3000 && !canStart(ty); i++) stepSim(.1); if (canStart(ty)) startDev(ty); }
if (DEBUG && QS.get('adv')) for (let i = 0, n = +QS.get('adv'); i < n; i++) stepSim(.1);
if (DEBUG && QS.get('t')) warpTo(+QS.get('t'));
if (FOCUS) {
  const d = defById(FOCUS);
  if (QS.has('cut')) facadeMode = 'cut';
  select(d, { sheet: false, fly: false });
  const v = viewFor(d); if (v) setView(...v);
  for (let i = 0; i < 400 && (i < 30 || warp > 0); i++) step(1 / 30, false);
  step(1 / 30);
} else setTimeout(() => select(ALL_DEF, { sheet: false }), REDUCE ? 0 : 1800);
</script>
