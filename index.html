<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>F&amp;S 공장 라이브 | 에프앤에스식품</title>
<meta name="description" content="에프앤에스식품 오산 HQ의 7층 제품 개발부터 1층 출고까지, 공정이 움직이는 3D 공장 화면" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  --glass: rgba(17, 20, 27, .74);
  --glass-hi: rgba(255, 255, 255, .07);
  --glass-hi2: rgba(255, 255, 255, .13);
  --line: rgba(255, 255, 255, .10);
  --text: #f4f5f7;
  --muted: #9aa3ae;
  --accent: #e8333c;
  --accent-soft: rgba(232, 51, 60, .2);
  --ok: #37d399;
  --warn: #f6b94a;
  --info: #62a8ff;
  --radius: 14px;
  font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #20232b; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid #ffffffcc; outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
}

/* top bar */
.topbar { position: fixed; z-index: 30; top: 10px; left: 10px; right: 10px; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 6px; white-space: nowrap; }
.logo { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font: italic 700 12.5px/1 Georgia, serif; color: #fff; box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 3.5px #fff; }
.brand b { display: block; font-size: 15px; letter-spacing: -.2px; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.search { position: relative; flex: 0 1 300px; min-width: 150px; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); padding: 0 12px 0 34px; font-size: 13.5px; outline: none; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; opacity: .6; }
.chip { height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); font-size: 13.5px; white-space: nowrap; }
.chip:hover { background: var(--glass-hi2); }
.chip.accent { background: var(--accent); border-color: transparent; font-weight: 600; }
.chip.accent:hover { background: #ff4750; }
.chip small { color: var(--muted); font-size: 12px; }
.chip .caret { opacity: .7; font-size: 10px; }
.spacer { flex: 1; }
.dd { position: relative; }
.menu { position: absolute; top: 46px; right: 0; min-width: 210px; padding: 6px; z-index: 40; }
.menu.left { left: 0; right: auto; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; font-size: 13.5px; }
.menu button:hover, .menu button[aria-selected='true'] { background: var(--glass-hi2); }
.menu small { color: var(--muted); margin-left: auto; font-size: 12px; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.menu a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: inherit; text-decoration: none; }
.menu a:hover { background: var(--glass-hi2); }
.menu a small { color: var(--muted); margin-left: auto; font-size: 12px; }
#area-menu { max-height: calc(100vh - 140px); overflow: auto; }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; white-space: nowrap; }
.clock b { font-size: 16px; }
.clock small { color: var(--muted); font-size: 11.5px; }
.sim { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); padding: 3px 7px; border-radius: 6px; letter-spacing: .2px; white-space: nowrap; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-hi); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.alerts-menu { width: 300px; max-height: 340px; overflow: auto; }
.alert-row { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
.alert-row + .alert-row { border-top: 1px solid var(--line); border-radius: 0; }
.alert-row time { color: var(--muted); font-size: 12px; flex: 0 0 38px; }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--glass-hi); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 0 13px; height: 30px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed='true'] { background: #fff; color: #15171c; font-weight: 600; }
.user { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #4b5563, #1f2937); display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--line); }

/* KPI cards */
.kpis { position: fixed; z-index: 20; top: 78px; left: 10px; display: flex; gap: 10px; }
.kpi { width: 232px; padding: 13px 14px 12px; display: grid; grid-template-columns: 34px 1fr auto; column-gap: 11px; align-items: center; }
.kpi .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: #ff7b80; }
.kpi .ic svg { width: 18px; height: 18px; }
.kpi h3 { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.kpi .val { font-size: 23px; font-weight: 700; letter-spacing: -.4px; margin-top: 2px; }
.kpi .val small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .sub { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kpi .spark { width: 64px; height: 30px; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 30px; }
.bars i { width: 9px; border-radius: 2px; background: var(--accent); opacity: .9; }

/* detail panel */
.detail { position: fixed; z-index: 20; top: 78px; right: 10px; width: 340px; max-height: calc(100% - 300px); display: flex; flex-direction: column; overflow: hidden; }
.detail-head { padding: 14px 14px 10px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); }
.detail-head .kind { font-size: 12px; color: var(--muted); }
.detail-head h2 { margin: 2px 0 0; font-size: 19px; letter-spacing: -.3px; line-height: 1.3; }
.detail-head .x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--glass-hi); font-size: 18px; line-height: 1; flex: 0 0 30px; }
.detail-body { padding: 10px 14px 14px; overflow-y: auto; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: rgba(55, 211, 153, .12); }
.pill.warn { color: var(--warn); background: rgba(246, 185, 74, .13); }
.pill.info { color: var(--info); background: rgba(98, 168, 255, .13); }
.pill.red { color: #ff7b80; background: var(--accent-soft); }
.pill.mute { color: var(--muted); background: var(--glass-hi); }
.stats { display: grid; gap: 0; margin: 4px 0 6px; }
.stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.stat span:first-child { color: var(--muted); }
.stat b { font-weight: 600; text-align: right; }
.prog { height: 6px; border-radius: 3px; background: var(--glass-hi2); overflow: hidden; margin: 6px 0 2px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.desc { font-size: 13.5px; line-height: 1.65; color: #d9dde2; margin: 10px 0 4px; word-break: keep-all; }
.note { font-size: 11.5px; line-height: 1.55; color: var(--muted); margin: 10px 0 0; word-break: keep-all; }
.cams-title { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 14px 0 8px; }
.cams-title small { color: var(--muted); font-weight: 400; }
.cams { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cam { position: relative; padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 10; background: #000; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
.cam span { position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px #000; }
.cam:hover img { opacity: 1; }

/* batch tracker */
.tracker { position: fixed; z-index: 20; left: 10px; bottom: 10px; width: 440px; padding: 13px 16px 14px; }
.tr-head { display: flex; align-items: center; gap: 8px; }
.tr-head h3 { margin: 0; font-size: 14px; }
.tr-id { font-size: 12px; font-weight: 700; background: var(--accent); padding: 3px 8px; border-radius: 6px; }
.tr-meta { font-size: 12px; color: var(--muted); }
.tr-eta { margin-left: auto; text-align: right; }
.tr-eta b { display: block; font-size: 17px; color: var(--ok); }
.tr-eta small { font-size: 11px; color: var(--muted); }
.tr-line { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 14px; }
.tr-line::before { content: ''; position: absolute; left: 8%; right: 8%; top: 9px; height: 2px; background: var(--glass-hi2); }
.tr-fill { position: absolute; left: 8%; top: 9px; height: 2px; background: var(--accent); width: 0; transition: width .4s; }
.tr-step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
.tr-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--glass-hi2); background: #22262f; display: grid; place-items: center; font-size: 11px; }
.tr-step.done .tr-dot { background: var(--accent); border-color: var(--accent); }
.tr-step.now .tr-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tr-step time { font-size: 12px; font-weight: 600; }
.tr-step span { font-size: 11px; color: var(--muted); line-height: 1.25; word-break: keep-all; }

/* table */
.table { position: fixed; z-index: 20; left: 460px; right: 360px; bottom: 10px; height: 214px; padding: 10px 12px; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; align-items: center; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-size: 13px; }
.tabs button[aria-selected='true'] { background: var(--accent); color: #fff; font-weight: 600; }
.tabs .live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(55, 211, 153, .2); }
.tbl-wrap { overflow: auto; margin-top: 6px; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; position: sticky; top: 0; background: rgba(22, 25, 32, .96); }
td { padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--glass-hi); }
tbody tr.sel td { background: var(--accent-soft); }
.mini { display: inline-block; width: 70px; height: 5px; border-radius: 3px; background: var(--glass-hi2); vertical-align: middle; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); }

/* world labels, selection label */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.wlabel { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; padding: 5px 10px; border-radius: 8px; background: rgba(17, 20, 27, .82); font-size: 12.5px; font-weight: 600; white-space: nowrap; transform-origin: 50% 100%; }
.wlabel::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 12px; margin-left: -1px; background: rgba(17, 20, 27, .82); }
.wlabel.sel { background: var(--accent); pointer-events: none; }
.wlabel.sel::after { background: var(--accent); }
.wlabel small { display: block; font-size: 11px; font-weight: 500; opacity: .85; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .78); display: grid; place-items: center; padding: 30px; }
.lightbox figure { margin: 0; max-width: min(1100px, 100%); }
.lightbox img { width: 100%; border-radius: 12px; display: block; }
.lightbox figcaption { margin-top: 10px; font-size: 13px; color: #d9dde2; }
.loading { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: #20232b; font-size: 14px; color: var(--muted); }
.mtabs { display: none; }

@media (max-width: 1320px) { .table { display: none; } }
@media (max-width: 1080px) { .kpi:nth-child(3) { display: none; } }
@media (max-width: 820px) {
  .topbar { top: 8px; left: 8px; right: 8px; height: auto; flex-wrap: wrap; padding: 8px; gap: 8px; }
  .brand small, .clock small, .user, .search, .brand div, .chip .caret, #weather-name { display: none; }
  .chip { padding: 0 9px; }
  .sim { font-size: 10.5px; padding: 3px 5px; }
  .seg button { padding: 0 9px; }
  .brand { padding-right: 0; }
  #area { order: 5; flex: 1 1 100%; }
  #area .chip { width: 100%; justify-content: space-between; }
  .chip#weather-btn small { display: none; }
  .kpis { top: var(--top, 112px); left: 8px; right: 8px; overflow-x: auto; scrollbar-width: none; }
  .kpi { flex: 0 0 200px; padding: 10px 12px; }
  .kpi:nth-child(3) { display: grid; }
  .kpi .val { font-size: 19px; }
  .kpi .spark, .kpi .bars { display: none; }
  .detail, .tracker, .table { left: 8px; right: 8px; width: auto; bottom: 62px; top: auto; max-height: 46vh; height: auto; display: none; }
  body[data-mtab='detail'] .detail { display: flex; }
  body[data-mtab='tracker'] .tracker { display: block; }
  body[data-mtab='table'] .table { display: flex; height: 46vh; }
  .mtabs { position: fixed; z-index: 25; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 4px; padding: 5px; }
  .mtabs button { flex: 1; border: 0; background: transparent; color: var(--muted); height: 38px; border-radius: 9px; font-size: 13px; }
  .mtabs button[aria-pressed='true'] { background: var(--accent); color: #fff; font-weight: 600; }
  .tr-step span { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { .tr-fill { transition: none; } }
</style>
</head>
<body data-mtab="none">
<canvas id="scene" aria-label="에프앤에스식품 오산 HQ와 평택 공장, 서울 사옥을 담은 3D 공장 화면"></canvas>
<div id="labels"></div>

<header class="topbar glass">
  <div class="brand"><span class="logo" aria-hidden="true">F&amp;S</span><div><b>에프앤에스식품</b><small>공장 라이브</small></div></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="층, 설비, 트럭 검색" autocomplete="off" aria-label="층, 설비, 트럭 검색" />
    <div class="menu left glass" id="search-menu" hidden></div>
  </div>
  <div class="dd" id="area">
    <button class="chip accent" id="area-btn" aria-haspopup="true" aria-expanded="false"><span id="area-name">오산 HQ 전체</span><span class="caret">▼</span></button>
    <div class="menu left glass" id="area-menu" hidden></div>
  </div>
  <div class="spacer"></div>
  <div class="dd">
    <button class="chip" id="weather-btn" aria-haspopup="true" aria-expanded="false"><span id="weather-ic"></span><b class="num" id="weather-temp">17°C</b><small id="weather-name">맑음</small><span class="caret">▼</span></button>
    <div class="menu glass" id="weather-menu" hidden></div>
  </div>
  <div class="clock"><b class="num" id="clock">16:50</b><small id="date">10월 12일 일요일</small></div>
  <span class="sim">시뮬레이션</span>
  <div class="dd">
    <button class="icon-btn" id="alert-btn" aria-label="알림" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge num" id="alert-count">0</span>
    </button>
    <div class="menu glass alerts-menu" id="alert-menu" hidden></div>
  </div>
  <div class="seg" id="facade-seg" role="group" aria-label="건물 보기"><button data-f="ext" aria-pressed="true">외관</button><button data-f="cut" aria-pressed="false">단면</button></div>
  <div class="seg" id="time-seg" role="group" aria-label="낮과 밤"><button data-time="day" aria-pressed="true">낮</button><button data-time="night" aria-pressed="false">밤</button></div>
  <div class="user" title="운영실">운영</div>
</header>

<section class="kpis" aria-label="주요 지표">
  <article class="kpi glass">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span>
    <div><h3>최근 1시간 출고</h3><div class="val num"><span id="k1">0</span><small>팔레트</small></div></div>
    <svg class="spark" id="k1-spark" viewBox="0 0 64 30"></svg>
    <div class="sub num" id="k1-sub">트럭 0대 출발</div>
  </article>
  <article class="kpi glass">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V10l5 3V10l5 3V7l8 4v10z"/></svg></span>
    <div><h3>가동 중인 생산층</h3><div class="val num"><span id="k2">0</span><small>/ 4개 층</small></div></div>
    <div class="bars" id="k2-bars"><i></i><i></i><i></i><i></i></div>
    <div class="sub" id="k2-sub">6·5F 파우더·시즈닝, 4·3F 소스·육수</div>
  </article>
  <article class="kpi glass">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 9 3-3 3 3M9 15l3 3 3-3"/></svg></span>
    <div><h3>화물엘리베이터</h3><div class="val num"><span id="k3">0</span><small>건 대기</small></div></div>
    <svg class="spark" id="k3-spark" viewBox="0 0 64 30"></svg>
    <div class="sub num" id="k3-sub">1F 대기</div>
  </article>
</section>

<aside class="detail glass" id="detail" aria-live="polite">
  <div class="detail-head">
    <div><div class="kind" id="d-kind">오산 HQ</div><h2 id="d-title">개발부터 출고까지</h2></div>
    <button class="x" id="d-close" aria-label="선택 해제">×</button>
  </div>
  <div class="detail-body" id="d-body"></div>
</aside>

<section class="tracker glass" id="tracker" aria-label="배치 트래커">
  <div class="tr-head">
    <h3>배치 트래커</h3><span class="tr-id num" id="tr-id">B-0000</span><span class="tr-meta" id="tr-meta"></span>
    <div class="tr-eta"><b class="num" id="tr-eta">--:--</b><small id="tr-eta-l">출고 예정</small></div>
  </div>
  <div class="tr-line" id="tr-line"><div class="tr-fill" id="tr-fill"></div></div>
</section>

<section class="table glass" id="table" aria-label="실시간 현황표">

function ribbon(curve, width, y, mat, seg = 400, offset = 0) {

  d.s = Math.min(d.route.len, d.s + d.v * dt);
  d.route.pose(d.s, _pose);

function laneRoute(sign) {

}

const TURN_IN_S = nearestS(LANES.W, 38.5, 48);

}
function laneFree(lane, s0, s1) { return !ROADV.some(v => v.lane === lane && v.s > s0 && v.s < s1); }
function stepRoad(dt) {
  const sg = signal();
  for (const v of [...ROADV]) {
    if (v.ghost) { if (sim.t > v.until) ROADV.splice(ROADV.indexOf(v), 1); continue; }
    let gap = Infinity;
    for (const o of ROADV) if (o !== v && o.lane === v.lane && o.s > v.s) gap = Math.min(gap, o.s - v.s - (o.len + v.len) / 2);
    const stop = STOP[v.lane], toStop = stop - v.s - v.len / 2;

    const want = Math.min(v.vmax, Math.max(0, gap - 2.2) * 1.3);

    if (v.s > R.len + 6) { ROADV.splice(ROADV.indexOf(v), 1); if (v.truck) removeTruck(v.truck); else disposeTree(v.obj); continue; }
    R.pose(clamp(v.s, 0, R.len), _pose);

const STAGE = [{ x: 8, z: -6, pallet: null }, { x: 10.5, z: -6, pallet: null }, { x: 13, z: -6, pallet: null }];
function moveCar(target, dt) {
  const dy = target - ELEV.y;

function stepElevator(dt) {

    case 'idle': if (E.queue.length) { E.job = E.queue.shift(); E.state = 'up'; } break;
    case 'up': if (moveCar(fy(E.job.n), dt)) { E.state = 'load'; E.t = 0; car.attach(E.job.pallet); E.from = E.job.pallet.position.clone(); } break;
    case 'load': {

    case 'unload': {

// ---------- production floors ----------
const PRODUCTS = { powder: ['파우더', '시즈닝'], sauce: ['소스', '육수'] };
const DUR = { produce: 26, pack: 20, move: 6 };
const SHOWER_IN = Route.pts([[17.3, 1.1], [15.4, 2.0], [12.5, 2.0]]);
const SHOWER_OUT = Route.pts([[12.5, 2.0], [10.2, 2.0], [8.8, 5.0], [8.6, 6.5]]);
const PUSH = Route.pts([[9.5, 8.6], [11.2, 8.6], [12.5, 8.6], [14.6, 7.4], [16.6, 3.0], [18.2, 0]]);
const FLOOR_CTRL = {};
for (const [i, n] of [6, 4, 5, 3].entries()) {
  const dyn = floors[n].dyn;
  const entrant = makePerson('suit'); entrant.position.set(17.3, 0, 1.1); dyn.add(entrant);
  const flyer = mbox(dyn, .56, .5, .56, 0, 0, 0, P.kraft); flyer.visible = false;

  for (let k = 0; k < 12; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 4), new THREE.MeshBasicMaterial({ color: 0xd8f3ff })); s.visible = false; dyn.add(s); air.push(s); }
  FLOOR_CTRL[n] = { n, kind: n >= 5 ? 'powder' : 'sauce', state: 'idle', t: -i * 14, batch: null, pallet: null, lobby: null, entrant, flyer, air, idx: i };
}
function newBatch(c) {
  const id = `B-${c.n}${String(++sim.batchSeq).padStart(3, '0')}`;
  const product = PRODUCTS[c.kind][(c.idx + sim.batchSeq) % PRODUCTS[c.kind].length];
  const b = { id, n: c.n, product, stage: '위생 진입', t: { hyg: sim.clock }, truck: null };
  sim.batches.unshift(b); if (sim.batches.length > 60) sim.batches.pop();

}
function stepFloor(c, dt) {
  c.t += dt;
  const e = c.entrant, dyn = floors[c.n].dyn;
  NOZ[c.n].emissiveIntensity = 0; c.air.forEach(s => { s.visible = false; });
  switch (c.state) {
    case 'idle': if (c.t >= 0) { c.batch = newBatch(c); c.state = 'hygiene'; c.t = 0; } break;
    case 'hygiene': {
      const tIn = SHOWER_IN.len / 1.4, tOut = SHOWER_OUT.len / 1.4;
      if (c.t < tIn) { SHOWER_IN.pose(c.t * 1.4, _pose); e.position.set(_pose.p.x, Math.abs(Math.sin(c.t * 9)) * .05, _pose.p.z); e.rotation.y = Math.atan2(_pose.t.x, _pose.t.z); }
      else if (c.t < tIn + 2.6) {
        e.position.set(12.5, 0, 2); e.rotation.y += dt * 2.5;
        NOZ[c.n].emissiveIntensity = 1 + Math.sin(c.t * 20) * .6;
        const k = (c.t - tIn) / 2.6;
        c.air.forEach((s, i) => { const side = i % 2 ? 1 : -1, ph = (k * 4 + i * .17) % 1; s.visible = true; s.position.set(11.9 + (i % 3) * .6, .6 + (i % 4) * .45, 2 + side * (1.8 - ph * 1.6)); });
      } else if (c.t < tIn + 2.6 + tOut) { const s = (c.t - tIn - 2.6) * 1.4; SHOWER_OUT.pose(s, _pose); e.position.set(_pose.p.x, Math.abs(Math.sin(c.t * 9)) * .05, _pose.p.z); e.rotation.y = Math.atan2(_pose.t.x, _pose.t.z); }
      else { c.state = 'produce'; c.t = 0; c.batch.stage = '생산'; c.batch.t.prod = sim.clock; }
      break;
    }
    case 'produce':
      e.position.set(8.6, 0, 6.5); e.rotation.y += angleDelta(e.rotation.y, Math.PI) * Math.min(1, dt * 6);
      if (c.t >= DUR.produce) { c.state = 'pack'; c.t = 0; c.batch.stage = '충전·포장'; c.batch.t.pack = sim.clock; c.pallet = makePallet('goods'); c.pallet.userData.setCount(0); c.pallet.position.set(9.5, 0, 8.6); dyn.add(c.pallet); }
      break;
    case 'pack': {
      const per = DUR.pack / 8, k = Math.min(8, Math.floor(c.t / per));
      c.pallet.userData.setCount(k);
      if (k < 8) {
        const f = c.t / per - k, slot = [k % 2 ? .29 : -.29, .14 + Math.floor(k / 4) * .5, k % 4 < 2 ? -.29 : .29];
        c.flyer.visible = true;
        c.flyer.position.set(lerp(8, 9.5 + slot[0], f), lerp(.95, slot[1], f) + Math.sin(f * Math.PI) * .8, lerp(2.5, 8.6 + slot[2], f));
      }
      e.position.set(8.6, 0, 6.5); e.rotation.y += angleDelta(e.rotation.y, Math.PI * .75) * Math.min(1, dt * 6);
      if (c.t >= DUR.pack) { c.state = 'blocked'; c.t = 0; }
      break;
    }
    case 'blocked': if (!c.lobby) { c.state = 'move'; c.t = 0; c.batch.stage = '층 이동'; } break;
    case 'move': {
      const k = ease(Math.min(1, c.t / DUR.move)); PUSH.pose(k * PUSH.len, _pose);
      c.pallet.position.set(_pose.p.x, 0, _pose.p.z);
      const h = Math.atan2(_pose.t.x, _pose.t.z);
      e.position.set(_pose.p.x - Math.sin(h) * 1.25, Math.abs(Math.sin(c.t * 9)) * .04, _pose.p.z - Math.cos(h) * 1.25); e.rotation.y = h;
      if (c.t >= DUR.move) {
        c.lobby = c.pallet; ELEV.queue.push({ n: c.n, pallet: c.pallet, batch: c.batch, at: sim.t });
        c.batch.stage = '엘리베이터 대기'; c.batch.t.lift = sim.clock;
        c.pallet = null; c.state = 'idle'; c.t = -1.5;

  }
}

const RACK = [];

function makeLift(home, heading) { const obj = makeForklift(floors[1].dyn); obj.position.set(home[0], 0, home[1]); obj.rotation.y = heading; return { obj, carriage: obj.userData.carriage, legs: [], leg: null, home, heading, cargo: null, busy: false }; }
const LIFT_A = makeLift([13.5, 6.4], -Math.PI / 2), LIFT_B = makeLift([-9, 6], 0);
const LIFTS = [LIFT_A, LIFT_B];
function approach(L, cx, cz, ax, az, liftTo, onEnd) {
  const fx = cx - ax * 1.5, fz = cz - az * 1.5;
  L.legs.push({ build: () => Route.pts([[L.obj.position.x, L.obj.position.z], [fx - ax * 2.6, fz - az * 2.6], [fx, fz]]), reverse: false, liftTo, onEnd });
}
function backOut(L, dist, ax, az, liftTo, onEnd) { L.legs.push({ build: () => { const { x, z } = L.obj.position; return Route.pts([[x, z], [x - ax * dist, z - az * dist]]); }, reverse: true, liftTo, onEnd }); }
function goHome(L) { L.legs.push({ build: () => Route.pts([[L.obj.position.x, L.obj.position.z], L.home]), reverse: false, liftTo: .05, home: true }); }
function pick(L, pallet) { L.carriage.attach(pallet); pallet.position.set(0, .02, 1.5); pallet.rotation.set(0, 0, 0); L.cargo = pallet; }
function decideA() {
  const L = LIFT_A;
  const truck = BAYS.filter(b => b.kind === 'out' && b.truck && b.truck.state === 'docked' && b.truck.cargo.length + b.truck.reserved < 6).map(b => b.truck).sort((a, b) => (b.cargo.length + b.reserved) - (a.cargo.length + a.reserved))[0];
  const staged = STAGE.find(s => s.pallet && !s.res), drop = DROP.find(s => s.pallet && !s.res);
  let src = null, srcA = null, dst = null;
  if (truck && (staged || drop)) { src = staged || drop; dst = { truck }; }
  else if (drop && STAGE.some(s => !s.pallet && !s.res)) { src = drop; dst = { stage: STAGE.find(s => !s.pallet && !s.res) }; }
  if (!src) { if (Math.hypot(L.obj.position.x - L.home[0], L.obj.position.z - L.home[1]) > .5) goHome(L); return; }
  srcA = src.x > 15 ? [1, 0] : [0, -1];
  src.res = true; if (dst.truck) dst.truck.reserved++; else dst.stage.res = true;
  const pallet = src.pallet, batch = src.batch;
  approach(L, src.x, src.z, ...srcA, .05, () => { pick(L, pallet); src.pallet = null; src.batch = null; src.res = false; });
  backOut(L, 2.6, ...srcA, .35);
  if (dst.truck) {
    const tr = dst.truck, k = tr.cargo.length + tr.reserved - 1, [sx, sz] = TRUCK_SLOTS[k];
    const bx = tr.bay.x;
    approach(L, bx + sx, 16.3 + sz, 0, 1, .2, () => { tr.obj.attach(pallet); pallet.position.set(sx, 1.0, sz); pallet.rotation.set(0, 0, 0); tr.cargo.push({ pallet, batch }); tr.reserved--; L.cargo = null; if (batch) { batch.stage = '상차 완료'; batch.t.load = sim.clock; } });
    backOut(L, 0, 0, 1, .05);
    L.legs.at(-1).build = () => { const { x, z } = L.obj.position; return Route.pts([[x, z], [x, 9.2]]); };
  } else {
    const st = dst.stage;
    approach(L, st.x, st.z, 0, -1, .05, () => { floors[1].dyn.attach(pallet); pallet.position.set(st.x, 0, st.z); pallet.rotation.set(0, 0, 0); st.pallet = pallet; st.batch = batch; st.res = false; L.cargo = null; if (batch) batch.stage = '1F 대기'; });
    backOut(L, 2.4, 0, -1, .05);
  }
}
function decideB() {
  const L = LIFT_B, bay = BAYS[0], tr = bay.truck;
  const slot = RACK.find(s => !s.pallet && !s.res);
  if (tr && tr.state === 'docked' && tr.cargo.length - tr.reserved > 0 && slot) {
    const item = tr.cargo[tr.cargo.length - 1 - tr.reserved]; tr.reserved++;
    const local = item.pallet.position, bx = bay.x;
    slot.res = true;
    approach(L, bx + local.x, 16.3 + local.z, 0, 1, .02, () => { pick(L, item.pallet); tr.cargo.splice(tr.cargo.indexOf(item), 1); tr.reserved--; });
    L.legs.push({ build: () => { const { x, z } = L.obj.position; return Route.pts([[x, z], [x, 8.8]]); }, reverse: true, liftTo: .3 });
    approach(L, slot.x, slot.z, 0, -1, slot.y - .02, () => { floors[1].dyn.attach(item.pallet); item.pallet.position.set(slot.x, slot.y, slot.z); item.pallet.rotation.set(0, 0, 0); slot.pallet = item.pallet; slot.res = false; L.cargo = null; });
    backOut(L, 2.6, 0, -1, .05);
    return;
  }
  if (Math.hypot(L.obj.position.x - L.home[0], L.obj.position.z - L.home[1]) > .5) goHome(L);
}
function stepLift(L, decide, dt) {
  if (!L.leg) {
    if (!L.legs.length) { decide(); if (!L.legs.length) { L.obj.rotation.y += angleDelta(L.obj.rotation.y, L.heading) * Math.min(1, dt * 4); return; } }
    const def = L.legs.shift();
    L.leg = { def, d: drive(L.obj, def.build(), { vmax: 4.2, acc: 3, reverse: def.reverse, turn: 8 }) };
  }
  const { def, d } = L.leg;
  const done = stepDrive(d, dt);
  const cy = L.carriage.position.y, ty = def.liftTo ?? cy;
  L.carriage.position.y = cy + clamp(ty - cy, -2 * dt, 2 * dt);
  if (done && Math.abs(L.carriage.position.y - ty) < .01) { def.onEnd?.(); L.leg = null; }
}
let consumeAt = 0;
function stepRack() {
  if (sim.t < consumeAt) return;
  consumeAt = sim.t + 28;
  const full = RACK.filter(s => s.pallet && !s.res);

// ---------- ambient motion ----------
function stepAmbient(dt) {
  const busy = n => FLOOR_CTRL[n] && ['produce', 'pack'].includes(FLOOR_CTRL[n].state);
  for (const s of SPINNERS) s.obj.rotation[s.axis] += s.speed * (busy(s.n) ? 2.6 : .5) * dt;
  for (const l of LINES) {
    const run = busy(l.n) ? 1 : .25;
    l.phase += l.speed * run * dt;
    const span = l.x1 - l.x0;
    l.items.forEach((it, i) => { it.position.x = l.x0 + ((i * span / l.items.length + l.phase) % span); });
  }
  for (const st of STEAM) {
    const strong = FLOOR_CTRL[st.n]?.state === 'produce';
    st.puffs.forEach((m, i) => {
      const k = (sim.t * (strong ? .7 : .35) + i / 3) % 1;
      m.position.set(st.x + Math.sin(k * 6 + i) * .25, st.y + k * .9, st.z);
      m.scale.setScalar(.5 + k * 1.1);
      m.material.opacity = (strong ? .55 : .2) * Math.sin(k * Math.PI);
    });
  }
}

function stepSim(dt) {
  sim.t += dt; sim.clock += dt * SIM_RATE;
  for (const c of Object.values(FLOOR_CTRL)) stepFloor(c, dt);
  stepElevator(dt);
  stepLift(LIFT_A, decideA, dt); stepLift(LIFT_B, decideB, dt);
  stepTrucks(dt); stepRoad(dt); stepRack(); stepAmbient(dt);
  if (!sim.qNext || sim.t > sim.qNext) { sim.qNext = sim.t + 1.5; sim.qHist.push(ELEV.queue.length + (ELEV.job ? 1 : 0)); if (sim.qHist.length > 24) sim.qHist.shift(); }
}

  const c = controls.target;
  if (rain.visible) {
    for (let i = 0; i < PCOUNT; i++) { let y = rainPos[i * 6 + 1] - 60 * dt; if (y < 0) y += BOXH; rainPos[i * 6 + 1] = y; rainPos[i * 6 + 4] = y + 2.2; }
    rain.position.set(c.x, 0, c.z); rainGeo.attributes.position.needsUpdate = true;
    if (rnd() < dt * .08) flash = 1;
  }
  if (snow.visible) {
    for (let i = 0; i < PCOUNT; i++) { let y = snowPos[i * 3 + 1] - 6 * dt; if (y < 0) y += BOXH; snowPos[i * 3 + 1] = y; snowPos[i * 3] += Math.sin(sim.t + i) * dt * .6; }
    snow.position.set(c.x, 0, c.z); snowGeo.attributes.position.needsUpdate = true;
  }
  flash = Math.max(0, flash - dt * 6);
  const white = new THREE.Color(0xf4f6f8);
  for (const m of GROUND_MATS) {
    if (m.userData.crown) { m.emissive.setScalar(.32 * snowK); continue; }
    m.color.copy(m.userData.base).multiplyScalar(1 - .28 * wetK).lerp(white, .82 * snowK);
    m.roughness = .82 - .45 * wetK;
  }
}

// ---------- time of day ----------
const C3 = c => new THREE.Color(c);
const SKY = { day: [C3('#6fa3d8'), C3('#b9d4ea'), C3('#e8eef2')], gold: [C3('#3f5c8e'), C3('#e09d74'), C3('#f8c08c')], night: [C3('#060a14'), C3('#111c33'), C3('#26324d')] };
const RISE = 6.6, SET = 17.95;
const sunUp = () => { const h = (sim.clock / 3600) % 24; return h > RISE + .1 && h < SET - .05; };
let warp = 0;
function warpTo(hour) { let d = hour * 3600 - (sim.clock % 86400); if (d < 0) d += 86400; warp = d; }
function stepWarp(dt) {
  if (warp <= 0) return;
  const s = Math.min(warp, Math.max(600, warp * dt * 2.2));
  warp -= s; sim.clock += s;
  for (const r of sim.shipped) r.time += s;
  for (const e of sim.events) e.time += s;
  for (const b of sim.batches) for (const k in b.t) b.t[k] += s;
}
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();
function stepTime() {
  const h = (sim.clock / 3600) % 24;
  const a = (h - RISE) / (SET - RISE);
  const se = Math.sin(Math.PI * clamp(a, -.15, 1.15));             // sun height proxy
  const day = clamp((se + .08) / .3, 0, 1), gold = 1 - clamp((se - .1) / .6, 0, 1);
  const hor = _c3.copy(SKY.day[2]).lerp(SKY.gold[2], gold * day).lerp(SKY.night[2], 1 - day);
  const azS = Math.PI * clamp(a, -.15, 1.15);
  skyU.sunPosition.value.set(Math.cos(azS), se * .75, Math.sin(azS) * .7 + .35).normalize();
  skyU.turbidity.value = weather === 'clear' ? 6.5 : 14; skyU.rayleigh.value = weather === 'clear' ? 1.5 : .5;
  sky.visible = weather !== 'fog';
  scene.background = sky.visible ? null : scene.fog.color;
  scene.environmentIntensity = lerp(.08, .32, day);
  const fogCol = weather === 'fog' ? _c1.set(0xc9ced3).lerp(hor, .3) : weather === 'rain' ? _c1.copy(hor).lerp(C3(0x8a96a3), .5) : hor;
  scene.fog.color.copy(fogCol);
  scene.fog.near = weather === 'fog' ? 60 : weather === 'rain' ? 300 : 900;
  scene.fog.far = weather === 'fog' ? 520 : weather === 'rain' ? 1400 : 2600;
  const az = Math.PI * clamp(a, 0, 1), elev = Math.max(.12, se) * .85;
  const dir = day > 0 ? V(Math.cos(az), Math.sin(elev) + .15, Math.sin(az) * .7 + .35).normalize() : V(-.4, .9, .3).normalize();
  sun.userData.dir = dir;
  const overcast = weather === 'clear' ? 1 : weather === 'snow' ? .55 : .45;
  sun.color.copy(_c1.set(0xfff4e6).lerp(C3(0xff9d55), gold)).lerp(C3(0x9fb4e0), 1 - day);
  sun.intensity = (lerp(.35, lerp(3.2, 2.5, gold), day)) * overcast;
  hemi.color.copy(_c1.set(0xd6e2ff).lerp(C3(0xffcfa8), gold * .85)).lerp(C3(0x34507e), 1 - day);
  hemi.groundColor.set(0x8f7b63).lerp(C3(0x1c2028), 1 - day);
  hemi.intensity = lerp(.35, .55, day) * (weather === 'clear' ? 1 : 1.3) + flash * 2.5;
  const night = 1 - day;
  WIN.emissiveIntensity = night * 1.1; BLUEGLASS.emissiveIntensity = night * .8; LIGHTP.emissiveIntensity = .55 + night * 1.6;
  LAMP.emissiveIntensity = .15 + night * 3; HEAD.emissiveIntensity = .2 + night * 3; TAIL.emissiveIntensity = .2 + night * 2.2;
  renderer.toneMappingExposure = lerp(.95, 1.0, day);
}

// ---------- layout-aware framing ----------
function hudInsets() {
  if (mqMobile.matches) { const top = $('.topbar').getBoundingClientRect().bottom + 80; const bot = document.body.dataset.mtab === 'none' ? 60 : innerHeight * .46 + 60; return { l: 0, r: 0, t: top, b: bot }; }
  const r = $('#detail').getBoundingClientRect();
  return { l: 0, r: innerWidth - r.left, t: 150, b: 230 };
}
function resize() {
  document.documentElement.style.setProperty('--top', `${Math.round($('.topbar').getBoundingClientRect().bottom + 8)}px`);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  const i = hudInsets();
  camera.setViewOffset(innerWidth, innerHeight, (i.r - i.l) / 2, (i.b - i.t) / 2, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  composer?.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

// ---------- loop ----------
let hudT = 0;
const limits = new THREE.Box3(V(-420, 0, -260), V(420, 60, 300));
function step(dt) {
  stepSim(dt); stepWarp(dt); stepWeather(dt); stepTime(); stepFacade(dt);
  SHUTTERS.forEach((m, i) => { const tr = BAYS[i].truck; const o = tr && tr.state === 'docked' ? tr.doorO || 0 : 0; m.scale.y = 1 - .9 * o; m.position.y = fy(1) + 3.0 - 1.5 * m.scale.y; });
  stepGlide(dt);
  if (!glide && followGet) { const p = followPos(); if (p && followPrev) { const d = p.clone().sub(followPrev); controls.target.add(d); camera.position.add(d); } followPrev = p; if (!p) followGet = null; }
  if (!glide) {
    controls.update();
    const c = V().copy(controls.target).clamp(limits.min, limits.max).sub(controls.target);
    if (c.lengthSq()) { controls.target.add(c); camera.position.add(c); }
  }
  const t = controls.target, dist = camera.position.distanceTo(t), half = clamp(dist * .42, 45, 460);
  sun.target.position.copy(t); sun.position.copy(t).addScaledVector(sun.userData.dir || V(0, 1, 0), 520);
  const sc = sun.shadow.camera;
  if (Math.abs(sc.right - half) > 2) { sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 20; sc.far = 1200; sc.updateProjectionMatrix(); }
  const ra = ringAnchor(selected);
  ring.visible = !!ra;
  if (ra) { ring.position.copy(ra[0]); ring.scale.setScalar(ra[1] * (1 + Math.sin(sim.t * 5) * .07)); }
  const far = dist > 140;
  for (const l of AREA_LABELS) { l.b.hidden = !far || (selected && selected.id === l.id); if (!l.b.hidden) project(l.pos, l.b); }
  if (selected && selected.kind !== 'map') {
    const a = ra ? ra[0].clone().add(V(0, selected.kind === 'truck' ? 4.4 : selected.kind === 'lift' ? 3 : selected.kind === 'elevator' ? 4.2 : 3.4, 0)) : selected.proxy ? selected.proxy.getWorldPosition(V()).add(V(0, (selected.proxy.geometry.parameters.height || 4) / 2 + 2, 0)) : null;
    selLabel.hidden = !a;
    if (a) { selLabel.innerHTML = `${selected.kind === 'truck' ? selected.truck.id : selected.name}<small>${selected.kind === 'truck' ? truckStatus(selected.truck) : selected.kind === 'lift' ? liftStatus(selected.lift) : selected.kind === 'elevator' ? `${ELEV_FLOOR()}F` : ''}</small>`; project(a, selLabel); }
  } else selLabel.hidden = true;
  hudT -= dt;
  if (hudT <= 0) { hudT = .4; updateKpis(); updateTracker(); updateTable(); updateAlerts(); updateClock(); if (selected || !$('#d-body').innerHTML) renderDetail(); }
  if (composer) composer.render(); else renderer.render(scene, camera);
}
const timer = new THREE.Clock();
function frame() { requestAnimationFrame(frame); const dt = Math.min(.05, timer.getDelta()); if (document.hidden) return; step(dt); }

// warm up: run the plant before the first frame so the yard and KPIs are already busy
const warm0 = performance.now();
for (let i = 0; i < 4200; i++) stepSim(.1);
if (DEBUG) console.info('warm-up ms', Math.round(performance.now() - warm0));
sim.unread = Math.min(sim.unread, 3);
$('#date').textContent = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
setWeather('clear'); sim.events.shift(); sim.unread = 3;
resize();
setView(...VIEWS.street());
renderDetail(); updateKpis(); updateTracker(); updateTable(); updateClock();
if (DEBUG) window.__sim = { setView, VIEWS, setFacade, step: (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) step(dt); }, select, defById, sim, TRUCKS, ELEV, FLOOR_CTRL, LIFT_A, LIFT_B, ROADV, camera, controls, renderer, scene, setWeather, warpTo, floors, V, get selected() { return selected; } };
$('#loading').hidden = true;
frame();
setTimeout(() => select(defById('hq'), { sheet: false }), REDUCE ? 0 : 1800);

</script>
